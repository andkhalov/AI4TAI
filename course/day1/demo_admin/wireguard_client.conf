# Учебный пример конфигурации клиента WireGuard.
# Ключи заменены на заглушки; файл безопасно передавать и разбирать на занятии.
[Interface]
PrivateKey = <ЗАГЛУШКА-приватный-ключ-клиента>
Address = 10.8.0.23/32
DNS = 10.8.0.1

[Peer]
PublicKey = <ЗАГЛУШКА-публичный-ключ-сервера>
AllowedIPs = 10.8.0.0/24
Endpoint = vpn.example-technoavia.ru:51820
PersistentKeepalive = 25
